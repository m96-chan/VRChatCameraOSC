name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      # candle-onnx (m96-chan/candle fork) generates its protobuf bindings
      # at build time via prost-build, which needs the `protoc` binary.
      - name: Install protoc
        run: brew install protobuf
      # Default features only (camera + mesh-gpu), NOT --all-features: the
      # opt-in `cuda` feature needs the CUDA toolkit (nvcc) to *build* —
      # cudarc's build script hard-fails without it, and CI runners have no
      # NVIDIA toolchain. cuda builds are verified on developer machines.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

  # Windows build gate (issue #11): the MediaFoundation capture backend has no
  # Windows dev machine to verify against, so CI is what proves the default
  # feature set (camera + mesh-gpu) builds and tests green on Windows. Same
  # feature policy as `test` above: default features only, no `cuda` (needs
  # the CUDA toolkit to build). The camera-dependent paths are ignored/skipped
  # tests here just like on the other runners (no webcam in CI).
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # candle-onnx (m96-chan/candle fork) generates its protobuf bindings
      # at build time via prost-build, which needs the `protoc` binary.
      - name: Install protoc
        run: choco install protoc --yes
      - name: Build
        run: cargo build
      - name: Test
        run: cargo test

  coverage:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      # candle-onnx (m96-chan/candle fork) generates its protobuf bindings
      # at build time via prost-build, which needs the `protoc` binary.
      - name: Install protoc
        run: brew install protobuf
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Coverage (fail under 90%)
        # The `camera` feature needs a real webcam, so exclude it from the
        # coverage run; measure the deterministic, testable surface. `main.rs`
        # is bin entry / terminal-I/O glue (not unit-tested) — exclude it.
        # The three MediaPipe ONNX stage files are model-runtime glue whose
        # execution paths need the (gitignored, auto-downloaded) .onnx models
        # — their tests correctly skip on a modelless CI runner, so they'd
        # only ever count as dead weight here. They ARE exercised by the
        # model-gated tests in tests/mediapipe_onnx.rs on developer machines.
        # The unit-testable mediapipe logic (roi/subset/util/head_pose in
        # mod.rs) stays measured.
        run: >
          cargo llvm-cov --no-default-features
          --ignore-filename-regex 'src/main\.rs|src/tracking/mediapipe/(detector|mesh|blendshape)\.rs'
          --fail-under-lines 90 --summary-only
