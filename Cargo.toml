[package]
name = "vrchat-camera-osc"
version = "0.1.0"
edition = "2021"
description = "Realtime face tracking for VRChat from a webcam, delivered over OSC"
license = "MIT OR Apache-2.0"
default-run = "vrchat-camera-osc"

[dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
# VRChat's per-avatar OSC config files (avatar-aware vrcft gating, issue #18
# phases 2-3) are JSON.
serde_json = "1"
toml = "0.8"
rosc = "0.11"
image = "0.25"
parking_lot = "0.12"

# Inference (pure-Rust) — FAN face-alignment network and the MediaPipe
# YuNet/FaceMesh V2/Blendshape V2 ONNX stack (issue #17), both ported to
# candle. Pinned to the `m96-chan/candle` fork (`avatacam` branch): upstream
# master plus the ONNX ops (`Reciprocal`, `ReduceSum` attr-axes, `Resize`
# linear, `Pad` constant, `DepthToSpace`) the MediaPipe graphs need. A single
# candle-core version across the whole project avoids two incompatible copies
# of its types.
candle-core = { git = "https://github.com/m96-chan/candle", branch = "avatacam" }
candle-nn = { git = "https://github.com/m96-chan/candle", branch = "avatacam" }
candle-onnx = { git = "https://github.com/m96-chan/candle", branch = "avatacam" }
safetensors = "0.8"

# GPU FaceMesh on burn-wgpu (Vulkan/Metal/DX12, driver-only — no CUDA
# toolkit): candle-onnx's per-op interpreter can't reach 30 FPS for the
# depthwise-heavy FaceMesh graph (~109 ms/frame CPU), so the realtime path
# runs it on this executor instead (ported from AvataCam #62, issue #17).
# Behind the default `mesh-gpu` feature; runtime falls back to the CPU stage
# when no GPU/driver is present.
burn = { version = "0.20", features = ["wgpu"], optional = true, default-features = false }

# One-time model-weight download (issue #12): blocking GET + TLS + redirects,
# no async runtime needed for a single startup download.
ureq = { version = "2", features = ["tls"] }

# TUI
ratatui = "0.29"
crossterm = "0.28"
# OSCQuery mDNS (issue #18 phase 3b): browse `_oscjson._tcp.local.` for the
# VRChat client and advertise our own `_osc._udp`/`_oscjson._tcp` services.
# Pure Rust, no async runtime — fits the std-thread design of osc::oscquery.
mdns-sd = "0.20"

[features]
default = ["camera", "mesh-gpu"]
# Enables the real webcam backend. Without it, only the synthetic FakeCamera is
# available (used by tests and CI, which have no camera).
camera = ["dep:nokhwa"]
# GPU FaceMesh stage (burn-wgpu, driver-only — no vendor toolkit needed).
# Default ON: it's what makes the MediaPipe backend realtime (30 FPS); the
# tracker falls back to the CPU stage at runtime when no GPU is usable.
mesh-gpu = ["dep:burn"]
# Opt-in GPU inference (issue #13): NOT part of `default` — macOS has no CUDA
# and most end users won't have an NVIDIA GPU + CUDA toolkit to build against.
# `Device::cuda_if_available` (used by FanTracker/SfdDetector) already falls
# back to CPU cleanly when this feature is off or no GPU is found, so this is
# purely an opt-in speedup, never a requirement.
cuda = ["candle-core/cuda", "candle-nn/cuda"]

# Camera capture, via nokhwa — backend picked per target OS so each platform
# only pulls in the native dependency it needs. Optional so the rest of the
# crate still builds if the native backend is unavailable on a given target.
[target.'cfg(target_os = "macos")'.dependencies]
nokhwa = { version = "0.10", features = ["input-avfoundation"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
nokhwa = { version = "0.10", features = ["input-v4l"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
nokhwa = { version = "0.10", features = ["input-msmf"], optional = true }

[dev-dependencies]
approx = "0.5"

[profile.release]
lto = "thin"
